# Pagina Inschrijven / Mijn inschrijving
intro: Schrijf je in om mee te lopen of te wandelen. Je krijgt een inloglink per e-mail, zonder wachtwoord.
login_bedankt: Check je mailbox! We stuurden je een inloglink. Klik erop om verder te gaan.
opgeslagen: Je inschrijving is opgeslagen. Tot op 14 februari!

privacy: >-
  We gebruiken je gegevens enkel voor de organisatie van de sponsorloop Running for Pauline
  en verwijderen ze na het evenement. Je kan je inschrijving op elk moment zelf verwijderen.

# Pagina Inschrijven / Mijn inschrijving
intro: >-
  Wil je samen met ons Kom op tegen Kanker steunen en een eventuele behandeling van Pauline?
  Schrijf je dan hier in voor de derde editie van ons loop- of wandelevenement op 14 februari in Assebroek.
  Bedankt voor je deelname!
login_uitleg: Vul je e-mailadres in. Je krijgt een inloglink per e-mail, zonder wachtwoord.
login_bedankt: Check je mailbox (en je ongewenste e-mail)! We stuurden je een inloglink. Klik erop om verder te gaan.
opgeslagen: Je inschrijving is opgeslagen. Tot op 14 februari!
max_deelnemers: 10

vragen_label: Heb je nog vragen of opmerkingen? Laat het ons gerust weten.
privacy: >-
  We gebruiken deze gegevens enkel voor de organisatie van de sponsorloop Running for Pauline
  en verwijderen ze na het evenement. Je kan je inschrijving op elk moment zelf aanpassen of verwijderen.

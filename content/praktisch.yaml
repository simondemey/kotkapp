faq:
  - vraag: Moet ik een minimumbedrag inzamelen?
    antwoord: Nee, meedoen kan vanaf elk bedrag.
  - vraag: Hoe werkt sponsoring per rondje?
    antwoord: Je sponsors beloven een bedrag per rondje. Na afloop wordt dat vermenigvuldigd met het aantal rondjes dat je gelopen of gewandeld hebt.
  - vraag: Waar gaat het geld naartoe?
    antwoord: Naar een mogelijke behandeling voor Pauline. Een deel gaat mee naar de Kom op tegen Kanker-loop op 14 maart in Boom.

# Praktische info (van de affiche "Praktische informatie"). **vet** mag in de teksten.
blokken:
  - titel: Waar?
    icoon: pin
    tekst: Daverlostraat 164, 8310 Assebroek (Brugge).
    link_label: Open in Google Maps
    link: https://www.google.com/maps/search/?api=1&query=Daverlostraat+164+8310+Assebroek
  - titel: Starturen
    icoon: klok
    tekst: Lopers en wandelaars kunnen starten vanaf **12.00 uur** en lopen of wandelen **tot 17.00 uur**.
  - titel: Inschrijven
    icoon: nummer
    tekst: >-
      Schrijf je **vooraf online** in.
      Op de dag zelf meld je je eerst aan bij de **administratiepost**.
    link_label: Schrijf je nu in
    link: inschrijven.html
  - titel: Parkeren
    icoon: auto
    tekst: >-
      Parkeren kan aan het **Sportcomplex Daverlo** (Dries 2, 8310 Brugge)
      of in de **omliggende straten**. Op het domein zelf kan **niet** geparkeerd worden.
    link_label: Sportcomplex Daverlo in Google Maps
    link: https://www.google.com/maps/search/?api=1&query=Dries+2+8310+Brugge
  - titel: Met de fiets
    icoon: fiets
    tekst: >-
      Kom je met de fiets? Rij door de **witte poort**.
      Op het einde van de dreef is een **fietsenstalling** voorzien.
  - titel: Kleedkamers & douches
    icoon: deur
    tekst: >-
      Er zijn **kleedkamers** voorzien voor **mannen en vrouwen**.
      Douches zijn helaas **niet** beschikbaar.
  - titel: Kledij
    icoon: jas
    tekst: >-
      Kleed je warm aan en breng zeker **reservekledij** mee,
      aangepast aan **koude of natte weersomstandigheden**.
  - titel: Betaling
    icoon: euro
    tekst: Betalen kan **cash** of via **QR-code met de bankapp**.
  - titel: Honger gekregen?
    icoon: eten
    tekst: De buikjes kunnen voldoende gevuld worden met **heerlijke taart, soep en frietjes**!
    link_label: Food & drinks
    link: food-drinks.html

  - titel: Contact & socials
    icoon: info
    tekst: >-
      Vragen? Mail ons op [sponserloopkotk@gmail.com](mailto:sponserloopkotk@gmail.com)
      of volg ons op [Instagram](https://www.instagram.com/sponsorloop_runningforpauline/)
      voor het laatste nieuws.

faq:
  - vraag: Moet ik een minimumbedrag inzamelen?
    antwoord: Nee, meedoen kan vanaf elk bedrag.
  - vraag: Hoe werkt sponsoring per rondje?
    antwoord: Je sponsors beloven een bedrag per rondje. Na afloop wordt dat vermenigvuldigd met het aantal rondjes dat je gelopen of gewandeld hebt.
  - vraag: Kan ik ook gewoon komen supporteren?
    antwoord: Zeker! Schrijf je in als supporter of kom gewoon langs om de lopers en wandelaars aan te moedigen.
  - vraag: Waar gaat het geld naartoe?
    antwoord: Naar een mogelijke behandeling voor Pauline. Een deel gaat mee naar de Kom op tegen Kanker-loop op 14 maart in Boom.
